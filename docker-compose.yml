# Slash commands: set GC_REGISTER_ON_START=1 in .env for hands-off registration,
# or run the one-off below once after first boot:
# > docker compose run --rm bot node src/registerCommands.js

services:
  bot:
    build: .
    image: global-chat-bot
    container_name: global-chat-bot
    restart: unless-stopped
    environment:
      GC_TOKEN: ${GC_TOKEN:?GC_TOKEN is required}
      GC_MIN_GAP_MS: ${GC_MIN_GAP_MS:-350}
      GC_MAX_ATTEMPTS: ${GC_MAX_ATTEMPTS:-5}
      GC_ALLOW_ANYONE: ${GC_ALLOW_ANYONE:-0}
      GC_LOG_LEVEL: ${GC_LOG_LEVEL:-info}
      GC_REGISTER_ON_START: ${GC_REGISTER_ON_START:-1}
      GC_DATA_FILE: /data/synced.json
    volumes:
      - gc-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gc-data:
